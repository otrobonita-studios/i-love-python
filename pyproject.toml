[project]
name = "i-love-python"
version = "0.1.0"
description = "A demo that proves it loves Python: live telemetry, review personas, git discipline, load testing — all in pure Python."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Jesper Karlsson" }]
urls = { repository = "https://github.com/otrobonita-studios/i-love-python" }
dependencies = ["nicegui>=1.4.30"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "radon",
    "bandit",
    "pip-audit",
    "mutmut",
    "coverage",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The HTML/CSS/SVG this module emits is embedded template text, not Python
# prose -- wrapping it at 100 columns would fight the markup, not clarify it.
"scripts/wiring_diagram.py" = ["E501"]
# Same reason: this module emits CSS custom properties and Quasar overrides.
"art/theme.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["nicegui", "nicegui.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slow tests (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["art", "panel", "review", "git_discipline", "explain", "loadtest", "scripts"]
omit = [
    "app.py",
    "*/render.py",
    "scripts/ci_yaml.py",
    "scripts/install_hooks.py",
    "scripts/wiring_diagram.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.bandit]
exclude_dirs = [".venv", "tests", "generated"]
