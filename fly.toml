# fly.toml app configuration file generated for i-love-py on 2026-09-16T18:10:41+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'i-love-py'
primary_region = 'arn'

[build]
[http_service]
  internal_port = 8321
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
