# GENERATED by scripts/ci_yaml.py -- do not edit by hand. Regenerate: python -m scripts.ci_yaml
# Pipeline for i-love-python (Otrobonita AI Labs).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: quality (ruff, mypy, pytest, radon, bandit, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install nicegui hypothesis pytest pytest-cov coverage ruff mypy radon bandit pip-audit
      - name: ruff format --check
        run: |
          python -m ruff format --check app.py art panel review git_discipline explain loadtest scripts tests
      - name: ruff lint
        run: |
          python -m ruff check app.py art panel review git_discipline explain loadtest scripts tests
      - name: mypy --strict
        run: |
          python -m mypy app.py art panel review git_discipline explain loadtest scripts
      - name: pytest with coverage
        run: |
          python -m pytest -q --cov --cov-report=xml --cov-report=term
      - name: radon complexity (no D/E)
        run: |
          out=$(python -m radon cc art panel review git_discipline explain loadtest scripts -s -n D)
          if [ -n "$out" ]; then
            echo "Functions at D/E complexity (forbidden by repo rules):"
            echo "$out"
            exit 1
          fi
          echo "No D/E complexity functions."
      - name: bandit security scan
        run: |
          python -m bandit -r art panel review git_discipline explain loadtest scripts
      - name: pip-audit dependency scan
        run: |
          python -m pip_audit
      - name: pure-Python language audit
        run: |
          python -m scripts.lang_audit
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  load-test:
    name: k6 load test against the running app
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install nicegui
      - name: boot the app
        run: |
          nohup python app.py > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8321/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8321/api/health
      - name: generate k6 script from the Python spec
        run: python -m loadtest.generate generated/k6/load.js
      - name: install k6
        run: |
          curl -sSfL https://github.com/loadimpact/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar -xz -C /tmp
          chmod +x /tmp/k6-v0.55.0-linux-amd64/k6
          /tmp/k6-v0.55.0-linux-amd64/k6 version
      - name: run k6
        run: /tmp/k6-v0.55.0-linux-amd64/k6 run generated/k6/load.js
